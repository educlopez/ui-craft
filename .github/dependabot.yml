version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/mcp"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # init, autobuild and analyze must share one version: CodeQL fails
      # when the steps of a workflow run different codeql-action releases.
      codeql-action:
        patterns:
          - "github/codeql-action*"
