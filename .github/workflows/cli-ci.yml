name: CLI CI

# Runs Go tests, vet, fmt, lint, and vuln-scan for the cli/ package.
# Per-harness assets are hand-authored and committed under cli/assets/ — no generation step.

on:
  push:
    paths:
      - 'cli/**'
      - '.github/workflows/cli-ci.yml'
  pull_request:
    paths:
      - 'cli/**'
      - '.github/workflows/cli-ci.yml'

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version: stable

      - name: Run tests (race detector)
        run: cd cli && go test -race ./...

  vet-fmt:
    name: Vet + Fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version: stable

      # The deadcode ratchet below is a Node script. The runner image ships Node, but relying
      # on a preinstalled toolchain is how a job breaks on an image bump nobody read.
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"

      - name: go vet
        run: cd cli && go vet ./...

      # A ratchet, not a gate: only growth fails. Losing the last caller of something is
      # invisible in a diff, and dead code that can still be called is how a fixed bug
      # comes back.
      - name: Unreachable functions did not grow
        run: node scripts/check-deadcode.mjs

      # Windows resolves the home directory from %USERPROFILE%, not $HOME. A test that sets
      # only HOME is isolated everywhere except there, where it reads and writes the real
      # user profile — and the failure it produces blames the code under test.
      - name: HOME overrides in tests also cover Windows
        run: node scripts/check-home-isolation.mjs

      - name: gofmt (fail on any unformatted file)
        run: |
          FILES=$(cd cli && gofmt -l .)
          if [ -n "$FILES" ]; then
            echo "Unformatted files:"
            echo "$FILES"
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version: stable

      - name: golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa  # v7.0.1
        with:
          version: v2.12.2
          working-directory: cli

  govulncheck:
    name: Vuln Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version: stable

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: cd cli && govulncheck ./...
