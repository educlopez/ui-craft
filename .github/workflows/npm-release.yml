name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options:
          - ui-craft-detect
          - ui-craft-mcp
      version:
        description: Exact package.json version to publish (without v prefix)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ inputs.package }}@${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Setup npm trusted publishing client
        run: npm install --global npm@11.5.1

      - name: Setup candidate package manager
        if: inputs.package == 'ui-craft-mcp'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9
          run_install: false

      - name: Build and validate stable MCP package before changing live pins
        if: inputs.package == 'ui-craft-mcp'
        working-directory: experiments/skills-mcp
        env:
          UI_CRAFT_RELEASE_STABLE: '1'
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm audit --prod --audit-level=high
          node build.mjs
          node run-tests.mjs unit
          python3 package-release.py --stable
          node run-tests.mjs release

      - name: Verify requested package and version
        env:
          REQUESTED_PACKAGE: ${{ inputs.package }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const packagePath =
            process.env.REQUESTED_PACKAGE === "ui-craft-mcp"
              ? "dist/marketplace-v2/npm/package.json"
              : "package.json";
          const pkg = JSON.parse(fs.readFileSync(packagePath, "utf8"));
          if (pkg.name !== process.env.REQUESTED_PACKAGE) {
            throw new Error(`package mismatch: expected ${process.env.REQUESTED_PACKAGE}, found ${pkg.name}`);
          }
          if (pkg.version !== process.env.REQUESTED_VERSION) {
            throw new Error(`version mismatch: requested ${process.env.REQUESTED_VERSION}, package.json has ${pkg.version}`);
          }
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(pkg.version)) {
            throw new Error(`refusing invalid semver: ${pkg.version}`);
          }
          NODE

      - name: Test detector package
        if: inputs.package == 'ui-craft-detect'
        run: |
          node --test scripts/detect.test.mjs
          npm pack --dry-run

      - name: Inspect stable MCP tarball
        if: inputs.package == 'ui-craft-mcp'
        working-directory: dist/marketplace-v2/npm
        run: npm pack --dry-run

      - name: Publish detector
        if: inputs.package == 'ui-craft-detect'
        run: npm publish --provenance --access public

      - name: Publish MCP
        if: inputs.package == 'ui-craft-mcp'
        working-directory: dist/marketplace-v2/npm
        run: npm publish --provenance --access public

  registry:
    name: Publish official MCP Registry metadata
    if: inputs.package == 'ui-craft-mcp'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: Verify npm ownership metadata is publicly available
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import {setTimeout as delay} from 'node:timers/promises';
          const version = process.env.REQUESTED_VERSION;
          let verified = false;
          for (let i = 0; i < 12; i++) {
            const response = await fetch(`https://registry.npmjs.org/ui-craft-mcp/${encodeURIComponent(version)}`, {signal: AbortSignal.timeout(20000)});
            if (response.ok) {
              const pkg = await response.json();
              if (pkg.name !== 'ui-craft-mcp' || pkg.version !== version || pkg.mcpName !== 'io.github.educlopez/ui-craft') throw new Error('Published npm identity mismatch');
              verified = true;
              break;
            }
            await delay(5000);
          }
          if (!verified) throw new Error('Published npm package not visible yet; rerun only this Registry job');
          NODE
      - name: Prepare the same versioned descriptor used by packaging
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import importlib.util, json, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('packager', 'experiments/skills-mcp/package-release.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          Path('server-release.json').write_text(json.dumps(module.registry_descriptor(os.environ['REQUESTED_VERSION']), indent=2) + '\n', encoding='utf-8')
          PY
      - name: Download checksum-pinned official publisher
        run: |
          curl --fail --location --silent --show-error --max-time 120 https://github.com/modelcontextprotocol/registry/releases/download/v1.8.17/mcp-publisher_linux_amd64.tar.gz -o publisher.tar.gz
          echo '4fbfe8236becd291a7a37b3e2cd7d5a6171ecf25c62a47f4fe92ef9b92007f9b  publisher.tar.gz' | sha256sum --check
          tar --extract --gzip --file publisher.tar.gz --no-same-owner --no-same-permissions mcp-publisher
          chmod +x mcp-publisher
      - name: Publish using existing GitHub repository identity
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server-release.json
      - name: Remove temporary Registry credentials
        if: always()
        run: |
          if [ -x ./mcp-publisher ]; then ./mcp-publisher logout; fi
