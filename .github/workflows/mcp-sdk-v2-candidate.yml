name: MCP SDK v2 candidate

on:
  pull_request:
    paths:
      - 'experiments/skills-mcp/**'
      - 'mcp/src/**'
      - 'skills/**'
      - 'commands/**'
      - 'scripts/**'
      - '.github/workflows/mcp-sdk-v2-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: Candidate ${{ matrix.os }} Node ${{ matrix.node }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22', '24']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: experiments/skills-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node build.mjs
      - name: Check native Windows guard bootstrap
        if: runner.os == 'Windows'
        run: node --test --test-timeout=45000 test/windows-start.test.mjs
      - run: node run-tests.mjs unit
      - run: python package-release.py
      - run: node run-tests.mjs release
      - name: Build and check explicit stable promotion without publishing
        env:
          UI_CRAFT_RELEASE_STABLE: '1'
        run: |
          python package-release.py --stable
          node run-tests.mjs release
