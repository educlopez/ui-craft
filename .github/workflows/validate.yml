name: Validate

# Canonical repository gate. Runs the complete Node, MCP, and Go verification
# matrix, including detector URL fixtures that bind to the runner's loopback.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4.3.0
        with:
          version: 9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Install MCP dependencies
        run: npm ci --prefix mcp

      # The frontmatter suite cross-checks every shipped file with a real YAML parser, and
      # exits 2 rather than passing when it cannot run — so the parser is installed here
      # instead of letting the gate quietly degrade to "not checked".
      - name: Install PyYAML for the frontmatter cross-check
        run: python3 -m pip install --quiet --break-system-packages pyyaml || python3 -m pip install --quiet pyyaml

      - name: Run canonical verification gate
        run: pnpm verify
