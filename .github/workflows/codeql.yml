name: CodeQL

# GitHub SAST for Go. Runs on every PR, push to main, and weekly.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 04:00 UTC every Monday
    - cron: '0 4 * * 1'

jobs:
  analyze:
    name: Analyze (Go)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version-file: cli/go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@c4dd10e44af883a891fe31ced449bcb4a6728b9b  # v3.37.6
        with:
          languages: go
          # Use the default query suite (security-extended covers OWASP Top 10)
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@c4dd10e44af883a891fe31ced449bcb4a6728b9b  # v3.37.6

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@c4dd10e44af883a891fe31ced449bcb4a6728b9b  # v3.37.6
        with:
          category: /language:go
